# Lấy giá mới, kiểm tra, rồi đăng lên GitHub Pages.
# Giờ trong cron là UTC. Sydney: UTC+10 (đến 4/10), UTC+11 (giờ mùa hè). Việt Nam: UTC+7. New York: UTC-4 / UTC-5.
# Phút lẻ (4, 19, 34, 49) để tránh giờ tròn: GitHub hay bỏ qua lịch chạy đúng phút 0 vì quá đông.
# Các action được khóa theo mã commit (không theo nhãn phiên bản) để không bị thay đổi ngầm.
name: Cap nhat bang gia

on:
  schedule:
    - cron: "4-59/15 23 * * 0-4"   # 10h-11h sáng giờ Sydney mùa hè: ASX mở cửa
    - cron: "4-59/15 0-8 * * 1-5"  # ASX (10h-16h Sydney) và Việt Nam (9h-15h giờ VN)
    - cron: "4-59/15 13-21 * * 1-5" # Phố Wall (9h30-16h giờ New York)
    - cron: "34 10 * * 1-5"         # buổi tối giờ Sydney: làm mới tỷ giá, hàng hóa
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config/**", "tests/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write   # lưu giá đóng cửa theo ngày vào data/daily
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Kiem thu logic (khong can mang)
        run: python -m pytest -q tests

      - name: Lay danh sach dong bo tu Claude (neu routine day len nhanh rieng)
        run: |
          if git fetch -q origin claude/sync-data 2>/dev/null; then
            git show FETCH_HEAD:config/from_claude.json > /tmp/sync_branch.json 2>/dev/null || true
            git show FETCH_HEAD:config/content.json > /tmp/content_branch.json 2>/dev/null || true
          fi

      - name: Lay gia va kiem tra du lieu
        id: fetch
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          python scripts/live_data.py --out site/data/latest.json \
            --prev "https://${OWNER,,}.github.io/${REPO}/data/latest.json" \
            --sync config/from_claude.json --sync /tmp/sync_branch.json \
            --snapshot data/daily
          # Nội dung bản tin/báo cáo cho trang 3D: lấy bản mới hơn giữa main và nhánh riêng của routine
          python - <<'PY'
          import json, shutil
          best, day = None, ""
          for p in ("config/content.json", "/tmp/content_branch.json"):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception:
                  continue
              if d.get("version") == 1 and str(d.get("updatedAt", "")) > day:
                  best, day = p, str(d.get("updatedAt", ""))
          if best:
              shutil.copy(best, "site/data/content.json")
              print("content.json:", best, day)
          PY

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Dang len GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Luu gia dong cua theo ngay
        run: |
          if [ -n "$(git status --porcelain data/daily)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily
            git commit -q -m "Gia dong cua $(date -u +%F)"
            git pull -q --rebase && git push -q
          fi
